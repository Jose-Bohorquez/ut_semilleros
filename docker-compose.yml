services:
  frontend:                            # Sirve el PWA estático (index.html, modules/, etc.)
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: ut_semilleros_frontend
    ports:
      - "8080:80"                      # http://localhost:8080
    volumes:
      - .:/usr/local/apache2/htdocs     # montado en vivo: los cambios se reflejan sin rebuild
    depends_on:
      - api

  api:                                 # Sirve el backend Laravel — services/api.service.js
    build:                             # espera la API en http://localhost:8000/api en dev/LAN.
      context: ./api
      dockerfile: ./Dockerfile
    container_name: ut_semilleros_api
    ports:
      - "8000:80"
    volumes:
      - ./api:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:9.0
    container_name: ut_semilleros_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ut_semilleros
      MYSQL_USER: jose
      MYSQL_PASSWORD: jose123
    ports:
      - "3306:3306"
    volumes:
      - ./db/data:/var/lib/mysql        # esquema real: correr `php artisan migrate --seed`
                                        # dentro del contenedor api, no un init.sql

  phpmyadmin:
    image: phpmyadmin:5.2.2
    container_name: ut_semilleros_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
