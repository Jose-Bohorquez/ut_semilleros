services:
  frontend:                            # Sirve el PWA estático (index.html, modules/, etc.)
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: ut_semilleros_frontend
    ports:
      - "8080:80"                      # http://localhost:8080
    volumes:
      - .:/usr/local/apache2/htdocs     # montado en vivo: los cambios se reflejan sin rebuild
    depends_on:
      - api

  api:                                 # Sirve el backend Laravel — services/api.service.js
    build:                             # espera la API en http://localhost:8000/api en dev/LAN.
      context: ./api
      dockerfile: ./Dockerfile
    container_name: ut_semilleros_api
    ports:
      - "8000:80"
    volumes:
      - ./api:/var/www/html
    environment:                       # Solo desarrollo: las variables del contenedor mandan sobre
      APP_ENV: local                   # api/.env (Laravel usa Dotenv inmutable), así un clon limpio
      APP_DEBUG: "true"                # funciona sin editar nada y un api/.env con datos reales
      APP_URL: http://localhost:8000   # nunca se usa en local.
      FRONTEND_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ut_semilleros
      DB_USERNAME: jose
      DB_PASSWORD: jose123
      MAIL_MAILER: log                 # ningún correo real sale del entorno local
      LOG_LEVEL: debug                 # el driver "log" de correo escribe a nivel debug; con el
                                        # LOG_LEVEL=error de producción, storage/logs/laravel.log
                                        # quedaba vacío y nadie podía leer un correo en local
                                        # (encontrado al probar CU04, 2026-09-29)
      CACHE_STORE: database            # igual que producción; el rate limit de login (RN14) lo usa
      QUEUE_CONNECTION: sync           # CU04 E4 en producción usa "database" + cron; en local no hay
                                        # worker corriendo, así que el correo de recuperación se
                                        # procesa al instante para poder probarlo (log de Laravel)
    depends_on:
      - db

  db:
    image: mysql:9.0
    container_name: ut_semilleros_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ut_semilleros
      MYSQL_USER: jose
      MYSQL_PASSWORD: jose123
    ports:
      - "3306:3306"
    volumes:
      - ./db/data:/var/lib/mysql        # esquema real: correr `php artisan migrate --seed`
                                        # dentro del contenedor api, no un init.sql

  phpmyadmin:
    image: phpmyadmin:5.2.2
    container_name: ut_semilleros_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
